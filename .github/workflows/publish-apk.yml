name: Publish verified preview APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK checksum
        working-directory: downloads
        run: sha256sum --check SHA256SUMS
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.1.0 downloads/app-debug.apk downloads/SHA256SUMS --clobber
