name: Publish verified preview APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview release tag
        required: true
        default: v0.2.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK checksum
        working-directory: downloads
        run: sha256sum --check SHA256SUMS
      - name: Create ZIP download
        working-directory: downloads
        run: zip -9 Hyper-Essentials.zip app-debug.apk SHA256SUMS
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" downloads/app-debug.apk downloads/SHA256SUMS downloads/Hyper-Essentials.zip --clobber
