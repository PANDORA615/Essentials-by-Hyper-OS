name: Hyper Essentials Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.1' 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hyper-essentials-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hyper-essentials-debug
          path: apk
      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-preview.sh apk/*.apk
